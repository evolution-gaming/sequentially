name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: evolution-gaming/scala-github-actions/.github/workflows/release.yml@144b8762ece97a25b24621f9d470542fa1e068b4 # v7.2.0
    secrets: inherit
    with:
      verify_sbt_command: 'cleanFull; check; all testFull package'
      publish_sbt_command: 'publish'
